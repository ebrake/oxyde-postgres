[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "oxyde-postgres-core"
version = "0.1.0"
description = "PostgreSQL 18+ Rust core for Oxyde for PostgreSQL"
readme = "crates/oxyde-core-py/README.md"
license = "MIT"
license-files = ["LICENSE", "vendor/sqlx-postgres/LICENSE-MIT", "vendor/sqlx-postgres/LICENSE-APACHE"]
requires-python = ">=3.10"
authors = [
    {name = "Nikita Ryzhenkov", email = "nikita.ryzhenkoff@gmail.com"}
]
keywords = ["orm", "rust", "database", "async", "performance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/ebrake/oxyde-postgres"
Documentation = "https://github.com/ebrake/oxyde-postgres#readme"
Repository = "https://github.com/ebrake/oxyde-postgres"
Issues = "https://github.com/ebrake/oxyde-postgres/issues"

[tool.maturin]
manifest-path = "crates/oxyde-core-py/Cargo.toml"
module-name = "_oxyde_core"
features = ["pyo3/extension-module"]

# Keep the patched driver and its licenses in source releases.
include = [{ path = "vendor/sqlx-postgres/**/*", format = "sdist" }]
