[package]
name = "oxyde-sql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
sea-query = { version = "1.0.2", default-features = false, features = ["thread-safe", "backend-postgres", "derive", "with-chrono", "with-uuid", "with-json", "with-rust_decimal", "postgres-array"] }
chrono = "0.4.45"
uuid = "1.29.2"
rust_decimal = { version = "1.43.0", features = ["serde"] }
oxyde-codec = { path = "../oxyde-codec" }
rmpv = { version = "1.3.1", features = ["with-serde"] }

[dev-dependencies]
insta = "1.49.0"
oxyde-migrate = { path = "../oxyde-migrate" }
