[package]
name = "oxyde-driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde_json.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "derive", "uuid", "chrono", "json", "rust_decimal"] }
once_cell = "1.21.4"
sea-query = { version = "1.0.2", default-features = false, features = ["thread-safe", "backend-postgres", "derive", "with-chrono", "with-uuid", "with-json", "with-rust_decimal", "postgres-array"] }
uuid = { version = "1.29.2", features = ["serde", "v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
rust_decimal = { version = "1.43.0", features = ["serde"] }
rmp = "0.8.15"
rmpv = { version = "1.3.1", features = ["with-serde"] }
futures = "0.3.34"
oxyde-codec = { path = "../oxyde-codec" }

[dev-dependencies]
tempfile = "3.27.0"
rmp-serde = "1.3.1"
oxyde-sql = { path = "../oxyde-sql" }
