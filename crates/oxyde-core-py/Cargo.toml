[package]
name = "oxyde-core-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "_oxyde_core"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
mimalloc = ["dep:mimalloc"]
jemalloc = ["dep:tikv-jemallocator"]

[lints]
workspace = true

[dependencies]
tokio.workspace = true
serde_json.workspace = true
anyhow.workspace = true
pyo3 = { version = "0.30.1", default-features = false, features = ["macros", "anyhow", "serde"] }
pyo3-async-runtimes = { version = "0.30.0", features = ["tokio-runtime"] }
rmpv = { version = "1.3.1", features = ["with-serde"] }
oxyde-codec = { path = "../oxyde-codec" }
oxyde-sql = { path = "../oxyde-sql" }
oxyde-driver = { path = "../oxyde-driver" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
oxyde-migrate = { path = "../oxyde-migrate" }
once_cell = "1.21.4"
sea-query = { version = "1.0.2", default-features = false, features = ["thread-safe", "backend-postgres"] }
futures = "0.3.34"

# Optional allocators for better memory management
mimalloc = { version = "0.1.52", default-features = false, optional = true }
tikv-jemallocator = { version = "0.7.0", optional = true }
