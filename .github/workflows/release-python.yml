name: Publish Python and complete combined release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true

permissions:
  contents: write  # Needed for release and docs

jobs:
  build:
    name: Build Python package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        working-directory: python
        run: uv build --no-sources

      - name: Verify licenses and metadata
        run: python scripts/check_release_artifacts.py python/dist --package oxyde-postgres

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: python-dist
          path: python/dist/*

  test:
    name: Test installation
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: python-dist
          path: dist

      - name: Install package
        run: |
          pip install dist/*.whl
          python -c "import oxyde, _oxyde_core; print(oxyde.__version__)"

  publish:
    name: Publish to PyPI
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/oxyde-postgres/
    permissions:
      id-token: write  # For trusted publishing
      contents: read

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "latest"

      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: python-dist
          path: dist

      - name: List artifacts
        run: ls -la dist/

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*

  # Optional: Create GitHub release
  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: python-dist
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          files: dist/*
          body_path: docs/changelog.md
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: Oxyde for PostgreSQL ${{ inputs.version }}
          draft: false
          make_latest: true
