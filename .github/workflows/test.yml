name: Test CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Detect which parts of the codebase changed
  changes:
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.filter.outputs.rust || github.event.forced }}
      python: ${{ steps.filter.outputs.python || github.event.forced }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4.0.1
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'vendor/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'pyproject.toml'
              - '.github/workflows/test.yml'
            python:
              - 'python/**'
              - '.github/workflows/test.yml'

  # Run pre-commit hooks (linting for both Rust and Python)
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Set up Python
        run: uv python install 3.15

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2.9.1

      - name: Install Python deps for mypy
        run: |
          uv venv --python 3.15
          uv pip install mypy==2.4.1 pydantic msgpack typing-extensions pre-commit typer

      - name: Run pre-commit
        run: uv run --no-project pre-commit run --all-files

  # Run Rust tests
  test-rust:
    needs: [changes, lint]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: oxyde
          POSTGRES_PASSWORD: oxyde
          POSTGRES_DB: oxyde
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oxyde"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres-old:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: oxyde
          POSTGRES_PASSWORD: oxyde
          POSTGRES_DB: oxyde
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U oxyde"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.15'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2.9.1

      - name: Run tests
        run: cargo test --workspace --no-default-features

      - name: PostgreSQL driver regressions
        env:
          OXYDE_TEST_POSTGRES_URL: postgresql://oxyde:oxyde@localhost:5432/oxyde
          OXYDE_TEST_OLD_POSTGRES_URL: postgresql://oxyde:oxyde@localhost:5433/oxyde
        run: cargo test -p oxyde-driver --lib --tests -- --ignored

  # Run Python tests
  test-python:
    needs: [changes, lint]
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Set up Python
        run: uv python install 3.15

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2.9.1

      - name: Build and install packages
        run: |
          uv venv --python 3.15
          uv pip install maturin
          uv run --no-project maturin develop --release --manifest-path crates/oxyde-core-py/Cargo.toml
          uv pip install -e "./python[dev]"

      - name: Run tests
        run: uv run --no-project pytest python -v
