name: Release Oxyde for PostgreSQL

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
      artifacts_run_id:
        description: 'Optional prior run with successful builds for this release tag'
        required: false

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Validate release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PYTHON'
          import os, tomllib
          from pathlib import Path
          core = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          orm = tomllib.loads(Path("python/pyproject.toml").read_text())["project"]["version"]
          requested = os.environ.get("REQUESTED_VERSION") or os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if requested != core or core != orm:
              raise SystemExit(f"Release {requested} does not match core={core}, ORM={orm}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={core}\ntag=v{core}", file=output)
          PYTHON

      - name: Verify the source release tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          ARTIFACTS_RUN_ID: ${{ inputs.artifacts_run_id }}
        run: |
          git fetch --depth=1 origin tag "$RELEASE_TAG"
          if [[ -z "$ARTIFACTS_RUN_ID" && "$(git rev-parse HEAD)" != "$(git rev-parse "$RELEASE_TAG^{commit}")" ]]; then
            echo "Build from the exact release tag before publishing"
            exit 1
          fi

      - name: Verify reusable builds belong to the release tag
        if: inputs.artifacts_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS_RUN_ID: ${{ inputs.artifacts_run_id }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch --depth=1 origin tag "$RELEASE_TAG"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACTS_RUN_ID" > prior-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACTS_RUN_ID/jobs?per_page=100" > prior-jobs.json
          python - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          run = json.loads(Path("prior-run.json").read_text())
          tag_sha = subprocess.check_output(["git", "rev-parse", os.environ["RELEASE_TAG"] + "^{commit}"], text=True).strip()
          if run["head_sha"] != tag_sha or run["path"] != ".github/workflows/release-core.yml":
              raise SystemExit("Reusable artifacts must come from this workflow at the exact release tag")
          targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
          expected = {"Build source distribution", *(f"Build {target} wheels" for target in targets)}
          successful = {job["name"] for job in json.loads(Path("prior-jobs.json").read_text())["jobs"] if job["conclusion"] == "success"}
          if expected - successful:
              raise SystemExit(f"Required builds did not succeed: {sorted(expected - successful)}")
          print(f"Reusing eight successful build jobs at {tag_sha}")
          PYTHON

      - name: Build sdist
        if: inputs.artifacts_run_id == ''
        uses: PyO3/maturin-action@v1.51.0
        with:
          maturin-version: v1.16.0
          command: sdist
          args: -m crates/oxyde-core-py/Cargo.toml --out dist

      - name: Upload sdist
        if: inputs.artifacts_run_id == ''
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz

  build-wheels:
    name: Build ${{ matrix.platform.target }} wheels
    needs: [build-sdist]
    if: inputs.artifacts_run_id == ''
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Linux x86_64 (glibc)
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: 2_28
          # Linux x86_64 (musl - Alpine)
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
          # Linux ARM64 (glibc)
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            manylinux: 2_28
          # Linux ARM64 (musl)
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
          # macOS x86_64 (Intel) - runs on ARM with Rosetta
          - os: macos-15
            target: x86_64-apple-darwin
            manylinux: auto
          # macOS ARM64 (Apple Silicon)
          - os: macos-15
            target: aarch64-apple-darwin
            manylinux: auto
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: auto

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Python (macOS/Windows)
        if: runner.os != 'Linux'
        uses: actions/setup-python@v6.2.0
        with:
          python-version: |
            3.13
            3.14
            3.15

      - name: Build wheels
        uses: PyO3/maturin-action@v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          maturin-version: v1.16.0
          args: --release --locked --out dist -m crates/oxyde-core-py/Cargo.toml -i 3.13 3.14 3.15
          sccache: 'true'
          manylinux: ${{ matrix.platform.manylinux }}

      - name: Verify native wheel import
        if: runner.os == 'Windows' || (runner.arch == 'ARM64' && matrix.platform.target == 'aarch64-apple-darwin') || (runner.os == 'macOS' && runner.arch == 'X64' && matrix.platform.target == 'x86_64-apple-darwin')
        run: |
          python -m pip install --no-deps --no-index --find-links dist oxyde-postgres-core
          python -c "import _oxyde_core"

      - name: Set up Python 3.14t (macOS/Windows)
        if: runner.os != 'Linux'
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14t'

      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          maturin-version: v1.16.0
          args: --release --locked --out dist -m crates/oxyde-core-py/Cargo.toml -i 3.14t
          sccache: 'true'
          manylinux: ${{ matrix.platform.manylinux }}

      - name: Upload wheels
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wheels-${{ matrix.platform.target }}
          path: dist/*.whl

  validate:
    name: Verify release licenses and metadata
    needs: [build-wheels, build-sdist]
    if: ${{ !cancelled() && needs.build-sdist.result == 'success' && (needs.build-wheels.result == 'success' || needs.build-wheels.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true
          run-id: ${{ inputs.artifacts_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - run: python -m unittest discover -s scripts/tests -v
      - run: python scripts/check_release_artifacts.py dist --package oxyde-postgres-core

  publish:
    name: Publish to PyPI
    needs: validate
    if: ${{ !cancelled() && needs.validate.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
      actions: read
    environment:
      name: pypi
      url: https://pypi.org/project/oxyde-postgres-core/

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "latest"

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true
          run-id: ${{ inputs.artifacts_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: List artifacts
        run: ls -la dist/

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*

  release:
    name: Stage combined release and publish Python package
    needs: [publish, build-sdist]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.build-sdist.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true
          run-id: ${{ inputs.artifacts_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          files: dist/*
          body_path: docs/changelog.md
          tag_name: ${{ needs.build-sdist.outputs.tag }}
          # The existing tag fixes the source commit. A branch target avoids
          # GitHub's workflow-write restriction when main advances later.
          target_commitish: ${{ github.event.repository.default_branch }}
          name: Oxyde for PostgreSQL ${{ needs.build-sdist.outputs.version }}
          draft: true

      - name: Publish Python package and complete combined release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-sdist.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build-sdist.outputs.version }}
        run: gh workflow run release-python.yml --ref "$RELEASE_TAG" -f version="$RELEASE_VERSION"
